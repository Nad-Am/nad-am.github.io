# Header
menu:
  首页: /
  归档: /archives
  友链: /links
  关于: /about

# 主页banner图
banner: /images/bg.jpg

# 归档页面背景图（如留空或不填，则使用上方默认的 banner 图）
# archive_banner: /images/archive.jpg

# 站点通知信息
notice: mkl;ams

# 作者信息
author:
  name: Nad Am
  avatar: /images/avatar.jpg
  description: 不必

toc:
  max_depth: 3 # 生成 TOC 的最大深度
  min_depth: 2 # 生成 TOC 的最小深度

comments:
  enable: true
  use: "valine" # 可选: "valine" (可匿名) || "giscus" (GitHub账号登录) || "gitalk" || "disqus"
  # valine 评论 (支持匿名评论)
  # docs: https://valine.js.org
  valine:
    appId: ovEEIlc8BNoZqq0GxEU1YIyF-gzGzoHsz
    appKey: UcUJhNpV6Jywbk2miaPIj0DG
    placeholder: 随便说点什么叭～ # 评论框占位提示符
    avatar: mp # Gravatar 头像展示方式
    pageSize: 10 # 评论列表分页，每页条数
    lang: zh-cn # 多语言支持
    visitor: true # 文章访问量统计
    recordIP: true # 是否记录评论者IP
    enableQQ: true # 是否启用昵称框自动获取QQ昵称和QQ头像，开启后是在昵称框输入QQ号码进行获取
    meta: "['nick', 'mail']" # 评论者输入框，可选：['nick']、['nick','mail']、['nick', 'mail', 'link']
    requiredFields: "[]" # 必填项：设置为 "[]" 即可实现完全匿名评论；若要限制填邮箱则改为 "['mail']"
    bilibiliEmoji: true # 是否启用Bilibili表情

  # giscus 评论 (GitHub账号登录评论，推荐，基于 GitHub Discussions)
  # docs: https://giscus.app/zh-CN
  giscus:
    repo: "Nad-Am/nad-am.github.io"
    repoId: "" # 从 https://giscus.app 获取

    category: "Announcements"
    categoryId: "" # 从 https://giscus.app 获取
    theme: "light"
    lang: "zh-CN"

  # disqus 评论
  # docs: https://disqus.com/
  disqus:
    website:
    error: 如果你看不到评论，那么就真的看不到评论 w(゜Д゜)w

# dplayer 视频播放
# docs: http://dplayer.js.org/#/zh-Hans/
dplayer:
  enable: true
  theme: "#b7daff"
  autoplay: false
  loop: false
  mutex: true

# aplayer 音频播放
# docs: https://aplayer.js.org/#/zh-Hans/
aplayer:
  enable: true
  theme: "#b7daff"
  autoplay: false
  loop: false
  mutex: true
  lrcType: 3

# mathjax LaTeX公式支持
# docs: http://docs.mathjax.org/en/latest/
mathjax:
  enable: true
  inlineMathMark: [['\\(', '\\)']] #内联公式标记, e.g. [['\\(', '\\)'],['$', '$']]

# polyfill 提供旧版本浏览器对新语法的支持
# website: https://cdnjs.cloudflare.com/polyfill
polyfill:
  enable: false

# jsdelivr镜像域名
# e.g. cdn.example.com
jsdelivr_mirror:

# 国内备案信息
beian:

# 谷歌分析
google_analytics:
# gauges分析
gauges_analytics:
# 百度分析
baidu_analytics:
# 腾讯分析
tencent_analytics:
# 站点ico
favicon: /images/avatar.jpg

# Social Icon
social_icon:
  enable: true
  icons:
    ins:
    zhihu:
    weibo:
    github: https://github.com/Nad-Am
    twitter:
